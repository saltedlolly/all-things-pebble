# Open source watchfaces and watchapps to add to the directory by hand.
#
# Use this for apps that aren't in the Pebble App Store, or that are in the
# store but don't list their source code there. Entries are merged into the
# generated lists in alphabetical order.
#
# Fields:
#   type:        watchface or watchapp (required)
#   title:       app name (required)
#   source:      link to the source code (required)
#   author:      developer name
#   developer:   link to the developer's page (e.g. their app store page)
#   store:       link to the app store listing, if it has one
#   screenshot:  image path relative to docs/, e.g. images/watchapps/my-app.png
#                (use a Pebble Time 2 screenshot if you can). Leave it out
#                for apps with a store link to use the store's screenshot.
#   description: one or two sentences
#   version:     latest version, e.g. 1.2
#   platforms:   watches it runs on, as platform names, e.g. [emery, gabbro, flint]
#   updated:     date of the latest release, e.g. 2026-05-01
#
# If an entry's store link matches an app the generator already lists, the
# details here override the store's.

- type: watchapp
  title: Stopwatch+
  author: sunpazed
  source: https://github.com/sunpazed/Pebble-Stopwatch-Plus
  store: https://apps.repebble.com/5822f80d34da21ff12000122
  description: An updated Stopwatch that tracks your running stats. Measure and track Distance and Pace - all without a companion app on your phone.
