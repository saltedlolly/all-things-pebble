name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every Monday at 05:17 UTC: refresh the watchface and watchapp lists
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Rebuild the open source watchface/watchapp lists from the Pebble App
      # Store. If the store API is down, carry on with the lists already in
      # the repo rather than failing the deploy.
      - name: Update watchface and watchapp lists
        id: apps
        continue-on-error: true
        run: python3 scripts/update_app_directory.py

      - name: Commit updated lists
        if: steps.apps.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/watchfaces.md docs/watchapps.md docs/watchfaces docs/watchapps docs/images/apps
          if git diff --cached --quiet; then
            echo "No changes to the lists."
          else
            git commit -m "Update watchface and watchapp lists from the Pebble App Store"
            git push
          fi

      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
